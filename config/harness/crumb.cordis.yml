# Crumb's protocol-pure DeepSeek Harness composition.
# Direct Harness shell and filesystem plugins are deliberately absent.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      pollinations:
        displayName: Pollinations
        apiKeyEnv: POLLINATIONS_API_KEY
        api: openai-completions
        baseURL: https://gen.pollinations.ai/v1
        models:
          - id: nova-fast
            name: Nova Fast
            contextWindow: 128000
            maxTokens: 8192
            reasoningEfforts: false
          - id: qwen-coder
            name: Qwen Coder
            contextWindow: 262144
            maxTokens: 8192
            reasoningEfforts: false
          - id: Circuit-Overtime/OreoLook
            name: OreoLook
            contextWindow: 256000
            maxTokens: 8192
            reasoningEfforts:
              low: low
              medium: medium
              high: high
            compat:
              supportsReasoningEffort: true
          - id: perplexity
            name: Perplexity Search
            contextWindow: 200000
            maxTokens: 8192
            reasoningEfforts: false

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: Crumb is a concise coding agent. Use only tools supplied by the crumb MCP server.
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: mcp-crumb
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: crumb
    transport: stdio
    command: !!js process.env.CRUMB_MCP_COMMAND
    args: ['mcp', 'serve']
    cwd: !!js process.env.DSH_CWD
    env:
      POLLINATIONS_API_KEY: !!js process.env.POLLINATIONS_API_KEY
    failOnStartupError: true
    reconnect:
      enabled: false

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
