[workspace]
members = [
    "crates/crumb-agent",
    "crates/crumb-auth",
    "crates/crumb-cli",
    "crates/crumb-core",
    "crates/crumb-history",
    "crates/crumb-harness-dsh",
    "crates/crumb-harness-cli",
    "crates/crumb-llm",
    "crates/crumb-mcp",
    "crates/crumb-native",
    "crates/crumb-optimize",
    "crates/crumb-platform",
    "crates/crumb-pollinations",
    "crates/crumb-pty",
    "crates/crumb-repl",
    "crates/crumb-tools",
    "crates/crumb-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bytes = "1.11"
crossterm = "0.29.0"
ctrlc = "3.4.7"
directories = "6.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
keyring = "4.1.6"
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", features = ["blocking", "form", "json", "stream"] }
reedline = { version = "0.51.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["time"] }
zeroize = "1.9"
url = "2.5.8"
