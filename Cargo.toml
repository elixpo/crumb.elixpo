[workspace]
members = [
    "crates/crumb-cli",
    "crates/crumb-core",
    "crates/crumb-platform",
    "crates/crumb-repl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
