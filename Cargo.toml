[workspace]
members = [
    "crates/crumb-cli",
    "crates/crumb-core",
    "crates/crumb-history",
    "crates/crumb-native",
    "crates/crumb-platform",
    "crates/crumb-pty",
    "crates/crumb-repl",
    "crates/crumb-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0.100"
crossterm = "0.29.0"
directories = "6.0.0"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
